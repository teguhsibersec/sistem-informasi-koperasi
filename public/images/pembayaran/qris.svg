    <path d="M80 0h20v20L80 0z" fill="#DC2626"/>
    <!-- QR Graphic Mark -->
    <g transform="translate(8, 8)">
        <rect x="0" y="0" width="24" height="24" rx="4" fill="#DC2626"/>
        <rect x="4" y="4" width="16" height="16" rx="2" fill="#FFFFFF"/>
        <rect x="8" y="8" width="8" height="8" rx="1" fill="#DC2626"/>
    </g>
    <!-- QRIS Typography -->
    <text x="36" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="16" font-weight="900" fill="#0F172A" letter-spacing="-0.5">QRIS</text>
    <text x="37" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="5" font-weight="800" fill="#DC2626" letter-spacing="0.5">INDONESIA</text>
